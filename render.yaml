services:
  - type: web
    name: atmos-lab-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FRONTEND_ORIGIN
        value: https://atmos-lab-frontend.onrender.com

  - type: web
    name: atmos-lab-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://atmos-lab-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
